plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'androidx.shade.sample'
    compileSdk rootProject.androidConfig.compileSdk
    defaultConfig {
        applicationId "androidx.shade.sample"
        minSdk 26
        targetSdk rootProject.androidConfig.targetSdk
        versionCode rootProject.androidConfig.versionCode
        versionName rootProject.androidConfig.versionName
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        tasks.register("dump${variant.name.capitalize()}Dependencies", DependencyReportTask) { task ->
            task.group = "dependency-analysis"
            task.description = "Dump the ${variant.name} variant compile/runtime classpath"
            task.configurations = [variant.compileConfiguration, variant.runtimeConfiguration] as Set
            task.outputFile = file("${rootProject.projectDir}/${variant.name}_dependencies.txt")
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation project(path: ':shade')
    implementation 'androidx.activity:activity-ktx:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.4.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.0'
}